# lookout example configuration.
#
# Copy to config.yaml and edit. Real hosts, addresses and secrets never belong
# in this repository: hostnames below are placeholders under the reserved
# .example domain, and secrets are read from the environment with ${VAR}.
#
#   lookout validate config.yaml    # checks everything before the process starts
#   lookout run config.yaml
#
# Recurring quiet windows (SPEC §8). Probes keep running; only delivery
# is suppressed. every: omitted means every day. Timezone defaults to UTC.
# Ad-hoc mutes: lookout mute --for 30m --group Public
mute:
  - every: [Saturday, Sunday]
    at: "02:00"
    duration: 3h
    timezone: UTC
    group: Public

# HTTP, DNS and domain checks. Certificate expiry is read from the HTTPS
# handshake of an http check — there is no separate type for it.

# Status page, JSON API and /metrics. Default is loopback only — the
# page is for the machine that runs lookout, not the rest of the LAN.
# Override to a LAN address if the start page lives on another host.
listen: 127.0.0.1:5665

state:
  # Durable state: current up/down, streak counters, incident starts.
  # Losing this file is safe — it costs history, not correctness.
  file: /var/lib/lookout/state.json
  # One JSONL line per check per UTC day. Defaults to history.jsonl
  # beside the state file.
  history: /var/lib/lookout/history.jsonl

defaults:
  interval: 60s
  timeout: 5s            # must be shorter than the interval
  failure_threshold: 3   # consecutive failures before a check is DOWN
  success_threshold: 2   # consecutive successes before it is UP again
  instability:
    # "N of the last M": catches a check that alternates up/down, which
    # consecutive counters never see, no matter how bad availability is.
    failures: 5
    window: 20
    cooldown: 1h
  # alert: true is the default and does not need to be written. Silence must
  # never be a configuration accident.

alerting:
  # mode: telegram is the default. The only way to run without notifications
  # is to say so here; a missing section or a missing token is an error, not
  # silent silence.
  #
  #   mode: none    # state, page and metrics only, nothing is ever sent
  #
  # After the first ready alert, wait this long and send every check that
  # changed during the window as one message. Stops a gateway drop from
  # producing one Telegram message per check.
  batch_window: 45s
  telegram:
    # Bot token and chat id are never written here:
    #   LOOKOUT_TELEGRAM_TOKEN
    #   LOOKOUT_TELEGRAM_CHAT_ID
    # Telegram is often unreachable directly; send through SOCKS5.
    proxy: socks5://proxy.example:1080

checks:
  - name: Photos
    group: Services
    type: http
    url: http://photos.service.example:8080/api/server/ping
    expect:
      status: 200
      body:
        ".res": "pong"

  - name: Router
    group: Core
    type: http
    url: http://router.lan.example/
    interval: 30s
    timeout: 3s
    expect:
      status: "200-399"
      response_time: "<1s"

  - name: Private API
    group: Services
    type: http
    url: https://api.service.example/health
    method: GET
    headers:
      Authorization: "Basic ${LOOKOUT_BASIC_AUTH}"
    expect:
      status: "<500"
      body:
        ".result.source.online": true
        ".components[0].degraded": false
      body_contains: "ok"
      response_time: "<2s"

  - name: Noisy Test Box
    group: Lab
    type: http
    url: http://lab.service.example:9000/
    alert: false          # monitored and graphed, but never notifies

  - name: MX
    group: Public
    type: dns
    host: service.example
    query_type: MX
    # resolver: 192.0.2.53   # optional; default is the system nameserver
    expect:
      rcode: NOERROR
      answers_contain: mail.service.example
    # interval defaults to 5m. A changed answer set (NS/MX/A snapshot)
    # is drift: the first probe is a baseline, later changes alert.

  - name: service.example
    group: Public
    type: domain
    domain: service.example
    interval: 24h         # required when defaults.interval is shorter; registries are not liveness endpoints
    # RDAP first; WHOIS on TCP/43 if the TLD has no RDAP
    # (.ru → whois.tcinet.ru, field paid-till).
