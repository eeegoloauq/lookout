name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # -trimpath keeps build machine paths out of the binary; the version the
      # page and `lookout version` print comes from the tag and the commit,
      # which Go records itself from the checkout.
      - name: build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -o dist/lookout-$os-$arch ./cmd/lookout
          done
          cd dist && sha256sum lookout-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
