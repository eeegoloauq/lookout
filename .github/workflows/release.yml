name: release

on:
  push:
    tags: ["v*"]
  # A tag that arrives in the same push as the branch does not start this
  # workflow, so the release can also be run by hand against the tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # -trimpath keeps build machine paths out of the binary; the version the
      # page and `lookout version` print comes from the tag and the commit,
      # which Go records itself from the checkout.
      - name: build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -o dist/lookout-$os-$arch ./cmd/lookout
          done
          cd dist && sha256sum lookout-* > SHA256SUMS

      # The release notes are the message of the annotated tag; the generated
      # commit list is appended after them.
      - name: Release notes from the tag message
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$PWD"
          : > "$RUNNER_TEMP/notes.md"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
          git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
