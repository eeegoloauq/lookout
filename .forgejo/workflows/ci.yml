# The pre-merge check, and the only thing this repository asks of the local
# runner: pull requests live in Forgejo, so the gate has to be here. Everything
# after the merge — main, tags, releases, publishing — runs on GitHub, where the
# copy of this file in .github/workflows does the same work for free.
#
# NB: because this directory exists, Forgejo ignores .github/workflows entirely.
name: ci

on:
  pull_request

permissions:
  contents: read

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: docker
    # The image carries the toolchain and a node binary — actions/checkout is a
    # JavaScript action and dies without one. The module cache and the build
    # cache live in named volumes: on one self-hosted runner they can simply stay on
    # disk between runs, with no archive to pack, upload and unpack every time.
    container:
      image: local/go-ci:latest
      volumes:
        - ci-go-mod:/go/pkg/mod
        - ci-go-build:/root/.cache/go-build
    steps:
      - uses: actions/checkout@v5
      # staticcheck is not here on purpose: it compiles from source on every run,
      # which is twelve minutes on this runner. GitHub runs it after the merge.
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build ./cmd/lookout
      # The example config is documentation, and documentation that does not
      # load is worse than none. LOOKOUT_BASIC_AUTH stands in for the secret
      # the example reads from the environment.
      - name: validate the example config
        run: LOOKOUT_BASIC_AUTH=x go run ./cmd/lookout validate config.example.yaml
